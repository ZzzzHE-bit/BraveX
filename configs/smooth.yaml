# 平滑优先配置 - Smoothness Focus
name: "smooth"
description: "极大提高 velocity/acceleration/jerk 权重，追求极致平滑"

robot: "franka.yml"
scene: "collision_test.yml"

cost:
  scene_collision: 5000.0
  self_collision: 5000.0
  cspace_position: 5000.0
  cspace_velocity: 15000.0
  cspace_acceleration: 15000.0
  cspace_jerk: 15000.0
  cspace_torque: 5000.0
  target_cspace_dist: 0.05
  start_cspace_dist: 0.001
  tool_pose: [1.0, 1.0]

planner:
  max_attempts: 3
  num_seeds: 32
  interpolation_dt: 0.02

experiment:
  steps: 15
  move_range: 0.1
